[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle every route, so direct visits
# and refreshes on /cigars, /shop, etc. don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
